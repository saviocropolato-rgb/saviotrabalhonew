<style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        #game-container {
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
        }

        canvas {
            border: 4px solid #ffffff;
            /* Força renderização pixelada estilosa */
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            background-color: #2d8a4e;
            cursor: crosshair;
        }

        .hud {
            position: absolute;
            top: 10px;
            width: 100%;
            display: flex;
            justify-content: space-around;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 2px 2px #000;
            pointer-events: none;
        }

        .controls-info {
            margin-top: 12px;
            font-size: 14px;
            color: #aaa;
            text-align: center;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div class="hud">
        <span id="score-blue">AZUL: 0</span>
        <span id="score-red">VERMELHO: 0</span>
    </div>
    <!-- Resolução interna baixa (320x240) para efeito Pixel Art autêntico -->
    <canvas id="gameCanvas" width="320" height="240" style="width: 800px; height: 600px;"></canvas>
</div>

<div class="controls-info">
    <b>Controles:</b> [WASD / Setas] Mover jogador | [Mouse] Mirar | [Espaço] Chutar / Passar
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

// Estado dos Controles
const keys = {};
const mouse = { x: canvas.width / 2, y: canvas.height / 2 };

window.addEventListener('keydown', e => { keys[e.code] = true; });
window.addEventListener('keyup', e => { keys[e.code] = false; });

canvas.addEventListener('mousemove', e => {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    mouse.x = (e.clientX - rect.left) * scaleX;
    mouse.y = (e.clientY - rect.top) * scaleY;
});

// Placar
let scoreBlue = 0;
let scoreRed = 0;

// Bola
const ball = {
    x: canvas.width / 2,
    y: canvas.height / 2,
    vx: 0,
    vy: 0,
    radius: 3,
    holder: null
};

// Classe dos Jogadores
class Player {
    constructor(x, y, team, isGK = false) {
        this.homeX = x;
        this.homeY = y;
        this.x = x;
        this.y = y;
        this.team = team; // 'blue' ou 'red'
        this.isGK = isGK;
        this.speed = 1.3;
        this.radius = 5;
    }

    update() {
        // Se este jogador está com a bola e é do time Azul, responde aos controles
        if (ball.holder === this && this.team === 'blue') {
            let dx = 0, dy = 0;
            if (keys['KeyW'] || keys['ArrowUp']) dy -= 1;
            if (keys['KeyS'] || keys['ArrowDown']) dy += 1;
            if (keys['KeyA'] || keys['ArrowLeft']) dx -= 1;
            if (keys['KeyD'] || keys['ArrowRight']) dx += 1;

            if (dx !== 0 && dy !== 0) {
                dx *= 0.7071;
                dy *= 0.7071;
            }

            this.x += dx * this.speed;
            this.y += dy * this.speed;
        } else {
            // IA simples de posicionamento e busca de bola
            const targetX = (ball.holder === null && getClosestPlayer(ball, players[this.team]) === this)
                ? ball.x
                : this.homeX + (ball.x - canvas.width / 2) * 0.3;

            const targetY = (ball.holder === null && getClosestPlayer(ball, players[this.team]) === this)
                ? ball.y
                : this.homeY + (ball.y - canvas.height / 2) * 0.3;

            const angle = Math.atan2(targetY - this.y, targetX - this.x);
            const dist = Math.hypot(targetX - this.x, targetY - this.y);

            if (dist > 3) {
                const aiSpeed = this.team === 'red' ? 0.95 : 0.85;
                this.x += Math.cos(angle) * aiSpeed;
                this.y += Math.sin(angle) * aiSpeed;
            }
        }

        // Limites do Campo
        this.x = Math.max(12, Math.min(canvas.width - 12, this.x));
        this.y = Math.max(12, Math.min(canvas.height - 12, this.y));
    }

    draw() {
        // Corpo do jogador em Pixel Art
        ctx.fillStyle = this.team === 'blue' ? '#2980b9' : '#c0392b';
        ctx.fillRect(Math.round(this.x - 3), Math.round(this.y - 3), 7, 7);

        // Cabeça / Pele
        ctx.fillStyle = '#f1c40f';
        ctx.fillRect(Math.round(this.x - 2), Math.round(this.y - 5), 5, 3);

        // Calção
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(Math.round(this.x - 3), Math.round(this.y + 2), 7, 2);

        // Destaque de seleção no jogador ativo
        if (ball.holder === this) {
            ctx.strokeStyle = '#f1c40f';
            ctx.lineWidth = 1;
            ctx.strokeRect(Math.round(this.x - 5), Math.round(this.y - 7), 11, 13);
        }
    }
}

// Criando os Times (5 x 5)
const players = {
    blue: [
        new Player(30, 120, 'blue', true),   // Goleiro
        new Player(80, 60, 'blue'),          // Defensor
        new Player(80, 180, 'blue'),         // Defensor
        new Player(130, 90, 'blue'),         // Meia
        new Player(140, 150, 'blue')         // Atacante
    ],
    red: [
        new Player(290, 120, 'red', true),   // Goleiro
        new Player(240, 60, 'red'),          // Defensor
        new Player(240, 180, 'red'),         // Defensor
        new Player(190, 90, 'red'),          // Meia
        new Player(180, 150, 'red')          // Atacante
    ]
};

function getClosestPlayer(target, playerList) {
    let closest = null;
    let minDist = Infinity;
    for (let p of playerList) {
        let d = Math.hypot(p.x - target.x, p.y - target.y);
        if (d < minDist) {
            minDist = d;
            closest = p;
        }
    }
    return closest;
}

// Mecânica de Passe e Chute
window.addEventListener('keydown', e => {
    if (e.code === 'Space' && ball.holder && ball.holder.team === 'blue') {
        const p = ball.holder;
        const angle = Math.atan2(mouse.y - p.y, mouse.x - p.x);
        const force = 4.5;

        ball.vx = Math.cos(angle) * force;
        ball.vy = Math.sin(angle) * force;
        ball.holder = null;
    }
});

function resetPositions() {
    ball.x = canvas.width / 2;
    ball.y = canvas.height / 2;
    ball.vx = 0;
    ball.vy = 0;
    ball.holder = null;

    for (let team in players) {
        players[team].forEach(p => {
            p.x = p.homeX;
            p.y = p.homeY;
        });
    }
}

function updateBall() {
    if (ball.holder) {
        ball.x = ball.holder.x + 4;
        ball.y = ball.holder.y + 2;
        ball.vx = 0;
        ball.vy = 0;
        return;
    }

    // Física e desaceleração da bola
    ball.x += ball.vx;
    ball.y += ball.vy;
    ball.vx *= 0.95;
    ball.vy *= 0.95;

    // Colisão com as linhas do campo
    if (ball.y - ball.radius < 10 || ball.y + ball.radius > canvas.height - 10) {
        ball.vy *= -1;
    }

    // Checagem de Gol
    if (ball.x < 10) {
        if (ball.y > 80 && ball.y < 160) {
            scoreRed++;
            document.getElementById('score-red').innerText = `VERMELHO: ${scoreRed}`;
            resetPositions();
        } else {
            ball.vx *= -1;
        }
    }

    if (ball.x > canvas.width - 10) {
        if (ball.y > 80 && ball.y < 160) {
            scoreBlue++;
            document.getElementById('score-blue').innerText = `AZUL: ${scoreBlue}`;
            resetPositions();
        } else {
            ball.vx *= -1;
        }
    }

    // Posse de Bola
    const allPlayers = [...players.blue, ...players.red];
    for (let p of allPlayers) {
        let dist = Math.hypot(p.x - ball.x, p.y - ball.y);
        if (dist < p.radius + ball.radius + 2) {
            ball.holder = p;
            break;
        }
    }

    // Troca automática de controle se nenhum time estiver com a bola
    if (!ball.holder) {
        const closestBlue = getClosestPlayer(ball, players.blue);
        if (closestBlue && Math.hypot(closestBlue.x - ball.x, closestBlue.y - ball.y) < 12) {
            ball.holder = closestBlue;
        }
    }
}

function drawPitch() {
    // Gramado em xadrez pixelado
    ctx.fillStyle = '#2d8a4e';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#257540';
    for (let i = 0; i < canvas.width; i += 32) {
        ctx.fillRect(i, 0, 16, canvas.height);
    }

    // Linhas de Demarcação
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1;

    // Borda Externa
    ctx.strokeRect(10, 10, canvas.width - 20, canvas.height - 20);

    // Linha Central e Círculo
    ctx.beginPath();
    ctx.moveTo(canvas.width / 2, 10);
    ctx.lineTo(canvas.width / 2, canvas.height - 10);
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(canvas.width / 2, canvas.height / 2, 25, 0, Math.PI * 2);
    ctx.stroke();

    // Traves / Áreas
    ctx.strokeRect(10, 70, 30, 100);
    ctx.strokeRect(canvas.width - 40, 70, 30, 100);

    // Redes
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(4, 80, 6, 80);
    ctx.fillRect(canvas.width - 10, 80, 6, 80);
}

function drawBall() {
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(Math.round(ball.x - 2), Math.round(ball.y - 2), 4, 4);
    ctx.fillStyle = '#000000';
    ctx.fillRect(Math.round(ball.x - 1), Math.round(ball.y - 1), 2, 2);
}

function drawCursor() {
    // Mira do Mouse
    ctx.strokeStyle = '#ffeb3b';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(Math.round(mouse.x), Math.round(mouse.y), 4, 0, Math.PI * 2);
    ctx.stroke();

    // Linha de trajetória quando o jogador tem a bola
    if (ball.holder && ball.holder.team === 'blue') {
        ctx.strokeStyle = 'rgba(255, 235, 59, 0.4)';
        ctx.beginPath();
        ctx.moveTo(ball.holder.x, ball.holder.y);
        ctx.lineTo(mouse.x, mouse.y);
        ctx.stroke();
    }
}

// Loop Principal do Jogo
function gameLoop() {
    // Atualização
    updateBall();
    players.blue.forEach(p => p.update());
    players.red.forEach(p => p.update());

    // Renderização
    drawPitch();
    players.blue.forEach(p => p.draw());
    players.red.forEach(p => p.draw());
    drawBall();
    drawCursor();

    requestAnimationFrame(gameLoop);
}

// Inicia o jogo
gameLoop();
</script>
</body>
</html>
