<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <title>Pixel Soccer 2D</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
        }

        canvas {
            border: 4px solid #ffffff;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            background-color: #2d8a4e;
            cursor: crosshair;
        }

        .hud {
            position: absolute;
            top: 10px;
            width: 100%;
            display: flex;
            justify-content: space-around;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 2px 2px #000;
            pointer-events: none;
            user-select: none;
        }

        .controls-info {
            margin-top: 12px;
            font-size: 14px;
            color: #aaa;
            text-align: center;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div class="hud">
        <span id="score-blue">AZUL: 0</span>
        <span id="score-red">VERMELHO: 0</span>
    </div>
    <canvas id="gameCanvas" width="320" height="240" style="width: 800px; height: 600px;"></canvas>
</div>

<div class="controls-info">
    <b>Controlos:</b> [WASD / Setas] Mover jogador | [Rato] Mirar | [Espaço] Chutar / Passar
</div>

<script>
window.addEventListener('load', () => {
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;

    const keys = {};
    const mouse = { x: canvas.width / 2, y: canvas.height / 2 };

    window.addEventListener('keydown', e => {
        keys[e.code] = true;
        if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) {
            e.preventDefault();
        }
    });

    window.addEventListener('keyup', e => {
        keys[e.code] = false;
    });

    canvas.addEventListener('mousemove', e => {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        mouse.x = (e.clientX - rect.left) * scaleX;
        mouse.y = (e.clientY - rect.top) * scaleY;
    });

    let scoreBlue = 0;
    let scoreRed = 0;

    const ball = {
        x: canvas.width / 2,
        y: canvas.height / 2,
        vx: 0,
        vy: 0,
        radius: 3,
        holder: null,
        cooldown: 0
    };

    class Player {
        constructor(x, y, team, isGK = false) {
            this.homeX = x;
            this.homeY = y;
            this.x = x;
            this.y = y;
            this.team = team;
            this.isGK = isGK;
            this.speed = 1.3;
            this.radius = 5;
            this.dirX = team === 'blue' ? 1 : -1;
            this.dirY = 0;
        }

        update() {
            const activeBlue = getActiveBluePlayer();

            if (this === activeBlue) {
                let dx = 0, dy = 0;
                if (keys['KeyW'] || keys['ArrowUp']) dy -= 1;
                if (keys['KeyS'] || keys['ArrowDown']) dy += 1;
                if (keys['KeyA'] || keys['ArrowLeft']) dx -= 1;
                if (keys['KeyD'] || keys['ArrowRight']) dx += 1;

                if (dx !== 0 || dy !== 0) {
                    const len = Math.hypot(dx, dy);
                    this.dirX = dx / len;
                    this.dirY = dy / len;
                    this.x += this.dirX * this.speed;
                    this.y += this.dirY * this.speed;
                }
            } else {
                let targetX = this.homeX;
                let targetY = this.homeY;

                if (this.team === 'red') {
                    if (ball.holder === this) {
                        targetX = 20;
                        targetY = canvas.height / 2;
                        if (this.x < 90) {
                            shootBall(this, 10, canvas.height / 2, 4.5);
                        }

                        targetX = ball.x;
                        targetY = ball.y;
