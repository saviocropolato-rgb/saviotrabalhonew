<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Pixel Soccer 2D</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        #game-container {
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
        }

        canvas {
            border: 4px solid #ffffff;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            background-color: #2d8a4e;
            cursor: crosshair;
        }

        .hud {
            position: absolute;
            top: 10px;
            width: 100%;
            display: flex;
            justify-content: space-around;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 2px 2px #000;
            pointer-events: none;
        }

        .controls-info {
            margin-top: 12px;
            font-size: 14px;
            color: #aaa;
            text-align: center;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div class="hud">
        <span id="score-blue">AZUL: 0</span>
        <span id="score-red">VERMELHO: 0</span>
    </div>
    <canvas id="gameCanvas" width="320" height="240" style="width: 800px; height: 600px;"></canvas>
</div>

<div class="controls-info">
    <b>Controles:</b> [WASD / Setas] Mover jogador | [Mouse] Mirar | [Espaço] Chutar / Passar
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

const keys = {};
const mouse = { x: canvas.width / 2, y: canvas.height / 2 };

window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (e.code === 'Space') e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

canvas.addEventListener('mousemove', e => {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    mouse.x = (e.clientX - rect.left) * scaleX;
    mouse.y = (e.clientY - rect.top) * scaleY;
});

let scoreBlue = 0;
let scoreRed = 0;

const ball = {
    x: canvas.width / 2,
    y: canvas.height / 2,
    vx: 0,
    vy: 0,
    radius: 3,
    holder: null
};

class Player {
    constructor(x, y, team, isGK = false) {
        this.homeX = x;
        this.homeY = y;
        this.x = x;
        this.y = y;
        this.team = team;
        this.isGK = isGK;
        this.speed = 1.3;
        this.radius = 5;
    }

    update() {
        const controlledBlue = getActiveBluePlayer();
        
        // Controle manual do jogador Azul atualmente selecionado
        if (this === controlledBlue) {
            let dx = 0, dy = 0;
            if (keys['KeyW'] || keys['ArrowUp']) dy -= 1;
            if (keys['KeyS'] || keys['ArrowDown']) dy += 1;
            if (keys['KeyA'] || keys['ArrowLeft']) dx -= 1;
            if (keys['KeyD'] || keys['ArrowRight']) dx += 1;

            if (dx !== 0 && dy !== 0) {
                dx *= 0.7071;
                dy *= 0.7071;
            }

            this.x += dx * this.speed;
            this.y += dy * this.speed;
        } else {
            // Comportamento de IA
            let targetX = this.homeX;
            let targetY = this.homeY;

            if (this.team === 'red') {
                if (ball.holder === this) {
                    // IA Vermelha ataca e chuta em direção ao gol azul
                    targetX = 20;
                    targetY = canvas.height / 2;
                    if (this.x < 90) {
                        const angle = Math.atan2((canvas.height / 2) - this.y, 10 - this.x);
                        ball.vx = Math.cos(angle) * 4;
                        ball.vy = Math.sin(angle) * 4;
                        ball.holder = null;
                    }
                } else {
                    const closestRed = getClosestPlayer(ball, players.red);
                    if (closestRed === this && !ball.holder) {
                        targetX = ball.x;
                        targetY = ball.y;
                    } else {
                        targetX = this.homeX + (ball.x - canvas.width / 2) * 0.4;
                        targetY = this.homeY + (ball.y - canvas.height / 2) * 0.4;
                    }
                }
            } else {
                // Jogadores azuis não selecionados
                targetX = this.homeX + (ball.x - canvas.width / 2) * 0.3;
                targetY = this.homeY + (ball.y - canvas.height / 2) * 0.3;
            }

            const angle = Math.atan2(targetY - this.y, targetX - this.x);
            const dist = Math.hypot(targetX - this.x, targetY - this.y);

            if (dist > 3) {
                const aiSpeed = this.team === 'red' ? 0.95 : 0.85;
                this.x += Math.cos(angle) * aiSpeed;
                this.y += Math.sin(angle) * aiSpeed;
            }
        }

        this.x = Math.max(12, Math.min(canvas.width - 12, this.x));
        this.y = Math.max(12, Math.min(canvas.height - 12, this.y));
    }

    draw() {
        ctx.fillStyle = this.team === 'blue' ? '#2980b9' : '#c0392b';
        ctx.fillRect(Math.round(this.x - 3), Math.round(this.y - 3), 7, 7);

        ctx.fillStyle = '#f1c40f';
        ctx.fillRect(Math.round(this.x - 2), Math.round(this.y - 5), 5, 3);

        ctx.fillStyle = '#ffffff';
        ctx.fillRect(Math.round(this.x - 3), Math.round(this.y + 2), 7, 2);

        if (this === getActiveBluePlayer()) {
            ctx.strokeStyle = '#f1c40f';
            ctx.lineWidth = 1;
            ctx.strokeRect(Math.round(this.x - 5), Math.round(this.y - 7), 11, 13);
        }
    }
}

const players = {
    blue: [
        new Player(30, 120, 'blue', true),
        new Player(80, 60, 'blue'),
        new Player(80, 180, 'blue'),
        new Player(130, 90, 'blue'),
        new Player(140, 150, 'blue')
    ],
    red: [
        new Player(290, 120, 'red', true),
        new Player(240, 60, 'red'),
        new Player(240, 180, 'red'),
        new Player(190, 90, 'red'),
        new Player(180, 150, 'red')
    ]
};

function getClosestPlayer(target, playerList) {
    let closest = null;
    let minDist = Infinity;
    for (let p of playerList) {
        let d = Math.hypot(p.x - target.x, p.y - target.y);
        if (d < minDist) {
            minDist = d;
            closest = p;
        }
    }
    return closest;
}

function getActiveBluePlayer() {
    if (ball.holder && ball.holder.team === 'blue') {
        return ball.holder;
    }
    const fieldPlayers = players.blue.filter(p => !p.isGK);
    return getClosestPlayer(ball, fieldPlayers) || players.blue[0];
}

window.addEventListener('keydown', e => {
    if (e.code === 'Space') {
        e.preventDefault();
        const activePlayer = getActiveBluePlayer();
        if (ball.holder === activePlayer) {
            const angle = Math.atan2(mouse.y - activePlayer.y, mouse.x - activePlayer.x);
            const force = 4.5;
            ball.vx = Math.cos(angle) * force;
            ball.vy = Math.sin(angle) * force;
            ball.holder = null;
        }
    }
});

function resetPositions() {
    ball.x = canvas.width / 2;
    ball.y = canvas.height / 2;
    ball.vx = 0;
    ball.vy = 0;
    ball.holder = null;

    for (let team in players) {
        players[team].forEach(p => {
            p.x = p.homeX;
            p.y = p.homeY;
        });
    }
}

function updateBall() {
    if (ball.holder) {
        ball.x = ball.holder.x + 4;
        ball.y = ball.holder.y + 2;
        ball.vx = 0;
        ball.vy = 0;
        return;
    }

    ball.x += ball.vx;
    ball.y += ball.vy;
    ball.vx *= 0.95;
    ball.vy *= 0.95
